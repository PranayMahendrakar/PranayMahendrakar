name: Refresh profile

# Rebuilds the live parts of the profile once a day: the stat tiles, the
# contribution skyline, the language bar and the three "latest" lists in
# README.md. Everything is drawn by scripts/build_profile.py from public data;
# the only action used is the checkout, pinned to a commit.

on:
  schedule:
    - cron: '17 2 * * *'        # 07:47 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'assets/tokens.json'
      - '.github/workflows/refresh-profile.yml'

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Rebuild images and lists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_profile.py

      - name: Commit what changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets
          if git diff --cached --quiet; then
            echo 'Nothing changed.'
          else
            git commit -m 'Refresh live profile data'
            # another push may have landed since the checkout
            git push || { git pull --rebase && git push; }
          fi
